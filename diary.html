<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情侣日记 | 双向守护</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
        .write-box {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 120px;
            border: 1px solid #ffd6e3;
            border-radius: 10px;
            padding: 12px;
            font-size: 16px;
            resize: none;
            outline: none;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #e86892;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            margin-top: 12px;
        }
        .diary-item {
            background: #fff;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
        }
        .diary-time {
            color: #999;
            font-size: 13px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
<div class="page-wrap">
    <h1 class="page-title">情侣日记</h1>
    <div class="write-box">
        <textarea id="diaryInput" placeholder="写下今天想对TA说的话..."></textarea>
        <button class="submit-btn" id="saveDiaryBtn">保存日记</button>
    </div>
    <div id="diaryList"></div>
</div>

<script type="module">
    import { getDiaryList, addDiary, watchDiaryCloud } from "./js/store.js";
    const input = document.getElementById("diaryInput");
    const saveBtn = document.getElementById("saveDiaryBtn");
    const listBox = document.getElementById("diaryList");

    function renderDiary() {
        const list = getDiaryList();
        let html = "";
        list.forEach(item => {
            html += `
            <div class="diary-item">
                <div class="diary-time">${item.time}</div>
                <div>${item.text}</div>
            </div>
            `
        })
        listBox.innerHTML = html || "<p style='text-align:center'>还没有日记，快来记录甜蜜吧</p>";
    }
    renderDiary();

    // 实时监听云端数据，自动刷新页面
    const unWatch = watchDiaryCloud(() => renderDiary());
    window.addEventListener("beforeunload", () => unWatch());

    saveBtn.addEventListener("click", async () => {
        const text = input.value.trim();
        if(!text) return alert("请输入日记内容！");
        await addDiary(text);
        input.value = "";
        renderDiary();
        alert("日记保存成功，已同步给另一半！");
    })
</script>
</body>
</html>
