<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>情侣日记 | 双向守护</title>
  <link rel="stylesheet" href="./css/style.css">
  <style>
    .write-box {
      background: #fff;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 22px;
    }
  </style>
</head>
<body>
<div class="page-wrap">
  <h1 class="page-title">情侣日记</h1>
  <div class="write-box">
    <textarea id="diaryInput" placeholder="写下今天想对TA说的甜蜜话语..."></textarea>
    <button class="submit-btn" id="saveDiaryBtn" style="background:#e86892;margin-top:16px;">保存日记并同步云端</button>
  </div>
  <div id="diaryList"></div>
</div>

<script type="module">
  import { getDiaryList, addDiary, watchDiaryCloud } from "./js/store.js";
  const input = document.getElementById("diaryInput");
  const saveBtn = document.getElementById("saveDiaryBtn");
  const listBox = document.getElementById("diaryList");

  // 渲染日记列表
  function renderDiary() {
    const list = getDiaryList();
    if (list.length === 0) {
      listBox.innerHTML = "<p style='text-align:center;color:#777;margin-top:40px;'>暂无日记，快来记录你们的甜蜜吧</p>";
      return;
    }
    let html = "";
    list.forEach(item => {
      html += `
      <div class="diary-item">
        <div style="color:#999;font-size:13px;margin-bottom:8px;">${item.time}</div>
        <div>${item.text}</div>
      </div>
      `
    })
    listBox.innerHTML = html;
  }
  renderDiary();

  // 实时监听云端数据自动刷新
  const unWatch = watchDiaryCloud(() => renderDiary());
  window.addEventListener("beforeunload", () => unWatch());

  // 保存日记按钮
  saveBtn.addEventListener("click", async () => {
    const text = input.value.trim();
    if (!text) {
      alert("请输入日记内容！");
      return;
    }
    await addDiary(text);
    input.value = "";
    renderDiary();
    alert("日记保存成功，已同步给另一半！");
  })
</script>
</body>
</html>
