<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双向守护 | 异地情侣陪伴小屋</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="skin-pink">
    <!-- 皮肤切换悬浮按钮 -->
    <div class="skin-switch-btn" id="skinSwitchBtn">🎨 切换主题</div>
    <div class="skin-panel hide" id="skinPanel">
        <h4>选择情侣皮肤</h4>
        <div class="skin-item" data-skin="skin-pink">温柔粉</div>
        <div class="skin-item" data-skin="skin-blue">治愈蓝</div>
        <div class="skin-item" data-skin="skin-purple">梦幻紫</div>
        <div class="skin-item" data-skin="skin-warm">暖橘色</div>
        <button class="close-skin">关闭</button>
    </div>

    <div class="container">
        <!-- 头部情侣信息 -->
        <header class="couple-header">
            <div class="online-status-wrap">
                <span id="selfOnline">🟢 我在线</span>
                <span id="partnerOnline">⚪ TA离线</span>
                <select id="onlineSelect">
                    <option value="online">在线</option>
                    <option value="offline">离开</option>
                </select>
            </div>
            <h1>💌 双向陪伴守护屋</h1>
            <div class="love-day">
                我们在一起：<span id="loveDays">0</span> 天
            </div>
            <div class="meet-count">
                距离下次见面：<span id="meetDay">0</span> 天
            </div>
            <div class="distance-box">
                异地实时距离：<span id="distanceText">未获取定位</span>
                <button id="getLocationBtn">获取双方定位计算距离</button>
            </div>
        </header>

        <!-- 基础信息设置弹窗 -->
        <div class="set-modal" id="setModal">
            <div class="modal-box">
                <h3>情侣基础设置（仅首次填写）</h3>
                <div class="input-item">
                    <label>你的名字</label>
                    <input type="text" id="nameA" placeholder="输入你的昵称">
                </div>
                <div class="input-item">
                    <label>对方名字</label>
                    <input type="text" id="nameB" placeholder="输入TA的昵称">
                </div>
                <div class="input-item">
                    <label>恋爱起始日期</label>
                    <input type="date" id="startLove">
                </div>
                <div class="input-item">
                    <label>下次见面日期</label>
                    <input type="date" id="meetDate">
                </div>
                <!-- 定位坐标存储 -->
                <div class="input-item">
                    <label>我的定位经度</label>
                    <input type="text" id="myLng" placeholder="自动获取">
                </div>
                <div class="input-item">
                    <label>我的定位纬度</label>
                    <input type="text" id="myLat" placeholder="自动获取">
                </div>
                <div class="input-item">
                    <label>对方定位经度</label>
                    <input type="text" id="taLng" placeholder="让对方填写">
                </div>
                <div class="input-item">
                    <label>对方定位纬度</label>
                    <input type="text" id="taLat" placeholder="让对方填写">
                </div>
                <button class="save-btn" id="saveSet">保存信息</button>
            </div>
        </div>

        <!-- 双人状态区域 -->
        <section class="status-box">
            <div class="person-card" id="cardA">
                <h2 id="showNameA">我</h2>
                <p>今日想念次数：<span class="miss-num" id="missA">0</span></p>
                <p>今日心情：<span id="moodA">未打卡</span></p>
                <button class="miss-btn" data-user="A">想念TA +1</button>
                <button class="mood-btn" data-user="A">打卡今日心情</button>
            </div>
            <div class="heart-icon">❤️</div>
            <div class="person-card" id="cardB">
                <h2 id="showNameB">TA</h2>
                <p>今日想念次数：<span class="miss-num" id="missB">0</span></p>
                <p>今日心情：<span id="moodB">未打卡</span></p>
                <button class="miss-btn" data-user="B">想念我 +1</button>
                <button class="mood-btn" data-user="B">打卡今日心情</button>
            </div>
        </section>

        <!-- 多组纪念日模块 -->
        <section class="anniversary-box">
            <h2>📅 情侣纪念日记录</h2>
            <div class="add-anniversary">
                <input type="text" id="anniName" placeholder="纪念日名称（如百天、生日）">
                <input type="date" id="anniDate">
                <button id="addAnniBtn">新增纪念日</button>
            </div>
            <div class="anni-list" id="anniList"></div>
        </section>

        <!-- 情侣相册上传模块 -->
        <section class="album-box">
            <h2>📷 情侣专属相册</h2>
            <div class="upload-area">
                <label for="imgUpload">点击上传合照</label>
                <input type="file" id="imgUpload" accept="image/*" multiple>
            </div>
            <div class="album-grid" id="albumGrid"></div>
        </section>

        <!-- 悄悄话留言板（新增删除、清空） -->
        <section class="message-box">
            <div class="msg-top-bar">
                <h2>📝 双向悄悄话信箱</h2>
                <button id="clearAllMsgBtn">一键清空全部留言</button>
            </div>
            <div class="send-area">
                <textarea id="msgInput" placeholder="写下想对TA说的话..."></textarea>
                <button id="sendMsg">发送悄悄话</button>
            </div>
            <div class="msg-list" id="msgList"></div>
        </section>
    </div>

    <!-- 心情选择弹窗 -->
    <div class="mood-modal" id="moodModal">
        <div class="modal-box">
            <h3>选择今日心情</h3>
            <div class="mood-select">
                <span class="mood-item" data-val="开心🥰">开心🥰</span>
                <span class="mood-item" data-val="平淡😌">平淡😌</span>
                <span class="mood-item" data-val="委屈🥺">委屈🥺</span>
                <span class="mood-item" data-val="想你💌">超级想你💌</span>
            </div>
            <button class="close-modal">关闭</button>
        </div>
    </div>
</body>
</html>
