<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>情侣相册 | 情侣双向守护</title>
  <link rel="stylesheet" href="./css/style.css">
  <style>
    .upload-box {
      background: #fff;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 22px;
    }
    .album-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .album-img-item {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      overflow: hidden;
      background: #f1f1f1;
    }
    .album-img-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .empty-tip {
      text-align: center;
      color: #777;
      margin-top: 40px;
    }
  </style>
</head>
<body>
<div class="page-wrap">
  <h1 class="page-title">情侣相册</h1>

  <div class="upload-box">
    <input type="file" id="fileInput" accept="image/*" hidden>
    <button class="submit-btn" id="uploadBtn" style="background:#72b8ff;">点击上传甜蜜合照（自动同步云端）</button>
  </div>

  <div class="album-grid" id="albumBox"></div>
</div>

<script type="module">
  import { getAlbumList, addAlbumImg, watchAlbumCloud } from "./js/store.js";
  const fileInput = document.getElementById("fileInput");
  const uploadBtn = document.getElementById("uploadBtn");
  const albumBox = document.getElementById("albumBox");

  // 渲染相册图片
  function renderAlbum() {
    const imgList = getAlbumList();
    if (imgList.length === 0) {
      albumBox.innerHTML = "<p class='empty-tip'>相册空空的，上传你们的合照记录美好吧</p>";
      return;
    }
    let html = "";
    imgList.forEach(base64 => {
      html += `
      <div class="album-img-item">
        <img src="${base64}" alt="情侣照片">
      </div>
      `
    })
    albumBox.innerHTML = html;
  }
  renderAlbum();

  // 云端监听，另一半上传图片自动刷新
  const unWatch = watchAlbumCloud(() => renderAlbum());
  window.addEventListener("beforeunload", () => unWatch());

  // 唤起文件选择
  uploadBtn.addEventListener("click", () => fileInput.click());

  // 读取图片转Base64上传存储
  fileInput.addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    // 限制5MB大图，防止存储溢出
    if (file.size > 5 * 1024 * 1024) {
      return alert("图片不能超过5MB，请压缩图片后重新上传");
    }
    const reader = new FileReader();
    reader.onload = async function (res) {
      await addAlbumImg(res.target.result);
      renderAlbum();
      alert("照片上传成功，已同步给另一半！");
    }
    reader.readAsDataURL(file);
  })
</script>
</body>
</html>
