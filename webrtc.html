<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>远程同屏互动 | 情侣双向守护</title>
  <link rel="stylesheet" href="./css/style.css">
  <!-- 引入WebRTC点对点通信库 -->
  <script src="https://cdn.jsdelivr.net/npm/simple-peer@9.11.1/simplepeer.min.js"></script>
  <style>
    .control-box{
      background:#fff;
      border-radius:20px;
      padding:24px;
      margin-bottom:22px;
    }
    textarea{
      width:100%;
      height:120px;
      border:1px solid #ddd;
      border-radius:12px;
      padding:14px;
      margin:16px 0;
      resize:none;
      font-size:15px;
    }
    .btn-row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-bottom:15px;
    }
    .create-offer{background:#7b3fd8;}
    .accept-offer{background:#36b989;}
    .share-screen{background:#ff94b4;}
    .video-box{
      background:#000;
      border-radius:20px;
      overflow:hidden;
      margin-top:20px;
    }
    video{
      width:100%;
      display:block;
      min-height:240px;
    }
    .tip-text{
      color:#666;
      font-size:14px;
      line-height:1.7;
    }
  </style>
</head>
<body>
<div class="page-wrap">
  <h1 class="page-title">WebRTC远程同屏互动</h1>
  <div class="control-box">
    <p class="tip-text">使用教程：<br>1. 一方点击【创建连接邀请】，复制生成的文本发给另一半<br>2. 另一半粘贴文本，点击【接受连接邀请】完成配对<br>3. 连接成功后开启屏幕共享，对方实时查看你的屏幕画面</p>
    <div class="btn-row">
      <button class="submit-btn create-offer" id="createOfferBtn">创建连接邀请</button>
      <button class="submit-btn accept-offer" id="acceptOfferBtn">接受连接邀请</button>
    </div>
    <textarea id="signalText" placeholder="粘贴对方发送的邀请 / 复制你的邀请发给情侣"></textarea>
    <button class="submit-btn share-screen" id="shareScreenBtn">开启屏幕共享（对方实时观看）</button>
  </div>
  <div class="video-box">
    <video id="remoteVideo" autoplay playsinline muted></video>
  </div>
</div>

<script>
    let peer = null;
    const signalText = document.getElementById("signalText");
    const createOfferBtn = document.getElementById("createOfferBtn");
    const acceptOfferBtn = document.getElementById("acceptOfferBtn");
    const shareScreenBtn = document.getElementById("shareScreenBtn");
    const remoteVideo = document.getElementById("remoteVideo");

    // 创建发起方连接
    createOfferBtn.addEventListener("click",async ()=>{
        peer = new SimplePeer({initiator:true,trickle:false});
        peer.on("signal",(data)=>{
            signalText.value = JSON.stringify(data);
            alert("邀请创建完成！复制框内全部文本发给你的情侣");
        })
        peer.on("stream",(stream)=>{
            remoteVideo.srcObject = stream;
        })
        peer.on("error",(err)=>alert("连接出错："+err.message));
    })

    // 接收方建立连接
    acceptOfferBtn.addEventListener("click",()=>{
        try{
            const signalData = JSON.parse(signalText.value.trim());
            peer = new SimplePeer({initiator:false,trickle:false});
            peer.on("signal",(data)=>{
                signalText.value = JSON.stringify(data);
                alert("应答信号已生成，复制发给对方即可完成连接！");
            })
            peer.on("stream",(stream)=>{
                remoteVideo.srcObject = stream;
            })
            peer.on("error",(err)=>alert("连接出错："+err.message));
            peer.signal(signalData);
        }catch(e){
            alert("邀请文本格式错误，请完整粘贴对方发送的全部内容");
        }
    })

    // 开启屏幕共享
    shareScreenBtn.addEventListener("click",async ()=>{
        if(!peer){
            alert("请先完成配对连接，再开启屏幕共享！");
            return;
        }
        try{
            const screenStream = await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});
            peer.addStream(screenStream);
            alert("屏幕共享已开启，另一半可以实时查看你的屏幕！");
            // 用户关闭共享时销毁视频流
            screenStream.getVideoTracks()[0].addEventListener("ended",()=>{
                screenStream.getTracks().forEach(track=>track.stop());
            })
        }catch(err){
            alert("屏幕共享开启失败："+err.message);
        }
    })
</script>
</body>
</html>
