<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>远程同屏互动 | 情侣双向守护</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/simple-peer@9.11.1/simplepeer.min.js"></script>
    <style>
        .control-box{
            background:#fff;
            border-radius:16px;
            padding:20px;
            margin-bottom:20px;
        }
        textarea{
            width:100%;
            height:100px;
            border:1px solid #ddd;
            border-radius:8px;
            padding:10px;
            margin:10px 0;
            resize:none;
        }
        .btn-row{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:10px;
            margin-bottom:15px;
        }
        .rtc-btn{
            padding:12px;
            border:none;
            border-radius:8px;
            color:#fff;
            font-size:15px;
        }
        .create-offer{background:#7b3fd8;}
        .accept-offer{background:#36b989;}
        .share-screen{background:#ff94b4;}
        .video-box{
            background:#000;
            border-radius:16px;
            overflow:hidden;
            margin-top:20px;
        }
        video{
            width:100%;
            display:block;
        }
        .tip-text{
            color:#666;
            font-size:14px;
            line-height:1.7;
        }
    </style>
</head>
<body>
<div class="page-wrap">
    <h1 class="page-title">WebRTC远程同屏互动</h1>
    <div class="control-box">
        <p class="tip-text">使用教程：<br>1. 一方点击【创建连接邀请】，复制生成的邀请文本发给对方<br>2. 另一方粘贴邀请文本，点击【接受连接邀请】<br>3. 连接成功后可开启屏幕共享、双向视频通话</p>
        <div class="btn-row">
            <button class="rtc-btn create-offer" id="createOfferBtn">创建连接邀请</button>
            <button class="rtc-btn accept-offer" id="acceptOfferBtn">接受连接邀请</button>
        </div>
        <textarea id="signalText" placeholder="粘贴对方发送的邀请/此处复制你的邀请发给情侣"></textarea>
        <button class="rtc-btn share-screen" id="shareScreenBtn" style="width:100%">开启屏幕共享（对方实时查看你的屏幕）</button>
    </div>
    <div class="video-box">
        <video id="remoteVideo" autoplay playsinline muted></video>
    </div>
</div>

<script>
    let peer = null;
    const signalText = document.getElementById("signalText");
    const createOfferBtn = document.getElementById("createOfferBtn");
    const acceptOfferBtn = document.getElementById("acceptOfferBtn");
    const shareScreenBtn = document.getElementById("shareScreenBtn");
    const remoteVideo = document.getElementById("remoteVideo");

    createOfferBtn.addEventListener("click",async ()=>{
        peer = new SimplePeer({initiator:true,trickle:false});
        peer.on("signal",(data)=>{
            signalText.value = JSON.stringify(data);
            alert("邀请创建完成，复制文本发给你的情侣！");
        })
        peer.on("stream",(stream)=>{
            remoteVideo.srcObject = stream;
        })
        peer.on("error",(err)=>alert("连接出错："+err));
    })

    acceptOfferBtn.addEventListener("click",()=>{
        try{
            const signalData = JSON.parse(signalText.value.trim());
            peer = new SimplePeer({initiator:false,trickle:false});
            peer.on("signal",(data)=>{
                signalText.value = JSON.stringify(data);
                alert("应答信号已生成，复制发给对方完成连接！");
            })
            peer.on("stream",(stream)=>{
                remoteVideo.srcObject = stream;
            })
            peer.on("error",(err)=>alert("连接出错："+err));
            peer.signal(signalData);
        }catch(e){
            alert("邀请文本格式错误，请确认完整粘贴对方发送的内容");
        }
    })

    shareScreenBtn.addEventListener("click",async ()=>{
        if(!peer){
            alert("请先建立连接后再开启屏幕共享！");
            return;
        }
        try{
            const screenStream = await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});
            peer.addStream(screenStream);
            alert("屏幕共享已开启，对方可以实时查看你的屏幕");
            screenStream.getVideoTracks()[0].addEventListener("ended",()=>{
                screenStream.getTracks().forEach(track=>track.stop());
            })
        }catch(err){
            alert("屏幕共享开启失败："+err.message);
        }
    })
</script>
</body>
</html>
